version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Navigating to frontend directory..."
      - cd frontend
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Building Vite React app..."
      - npm run build
  post_build:
    commands:
      - echo "Syncing to S3..."
      - aws s3 sync dist/ s3://chatpulse-frontend-bucket --delete
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id E3I0Y9RP3FPSV9 --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
